# CI cho fork Binhho0505/carbon — xem FORK_CICD.md
# Chạy trên mọi Pull Request vào main và mỗi lần push lên main.
# Tập trung vào phần fork tự sửa: kế toán TT99, bộ dữ liệu giả lập FMCG, ERP.
name: Fork CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "1"
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  check:
    name: Lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm exec biome check packages/database/src/datasets apps/erp/app/modules/invoicing apps/erp/app/modules/accounting apps/erp/app/modules/settings

      - name: Typecheck @carbon/database
        run: pnpm --filter @carbon/database exec tsc --noEmit -p .

      - name: Typecheck ERP
        run: pnpm turbo run typecheck --filter=erp

      - name: Dataset tests (FMCG + TT99 + validator)
        run: pnpm --filter @carbon/database exec vitest run src/datasets

      - name: Authz migration test
        run: pnpm --filter @carbon/database exec vitest run src/authz/migration.test.ts

      - name: Purchase posting amounts (TT99 input VAT)
        run: pnpm --filter erp exec vitest run test/database/post-purchase-invoice/purchase-posting-amounts.test.ts

  images:
    name: Docker images (ERP + MES)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [erp, mes]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
